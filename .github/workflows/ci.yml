name: CI

# IcBerg CI: lint + the security regression gate (scripts/security_gate.sh) on every
# push and pull request. The security gate runs the red-team/PII/approval-workflow
# suites (tests/security, tests/api, tests/integration) followed by the full test
# suite, and is a required, blocking check — a regression in SQL-governance policy,
# PII redaction, or the approval workflow must fail CI, not just get logged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]" sqlglot mcp pyyaml

      - name: Ruff lint
        run: ruff check .

  security-gate:
    name: Security gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Install project (dev extras + governance-layer deps)
        run: |
          source .venv/bin/activate
          uv pip install -e ".[dev]" sqlglot mcp pyyaml

      - name: Run security regression gate
        run: bash scripts/security_gate.sh
