[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "icberg*"]

[project]
name = "icberg"
version = "0.1.0"
description = "Titanic Dataset Conversational Analysis Agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # Core Framework
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",

    # Agent
    "langgraph>=1.0.0",
    "langgraph-prebuilt>=1.0.0",

    # LLM Providers (LangChain integrations)
    "langchain-cerebras>=0.8.0",
    "langchain-groq>=1.1.0",

    # SQL parsing/rewriting for the governance gate
    "sqlglot>=25.0.0",

    # Phase 3 integration surfaces: MCP server + policy YAML (langchain-core is already
    # pulled in transitively by the langchain-* provider packages above)
    "mcp>=2.0.0",
    "pyyaml>=6.0.0",
    "langchain-core>=0.3.0",

    # Logging
    "structlog>=25.5.0",

    # Phase 3 observability: OpenTelemetry tracing + Prometheus metrics
    # (backend/core/telemetry.py)
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "prometheus-client>=0.21.0",

    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
