# Render Blueprint for the IcBerg governance gateway.
# Deploys the FastAPI service (backend.gateway_app:app) behind Render's $PORT, seeding a
# demo SQLite database on start so /query has tables to govern. Health-checked at /health.
#
# To use: in Render, create a "Blueprint" from this repo (or point an existing web service
# at these Build/Start commands). Delete the old Streamlit frontend service — it is removed
# from the repo. For a real database, set ICBERG_GATEWAY_DB_PATH to a persistent disk / DSN
# and drop the seed step from startCommand.
services:
  - type: web
    name: icberg-gateway
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -e .
    startCommand: >-
      python scripts/seed_demo_db.py --db-path "$ICBERG_GATEWAY_DB_PATH" &&
      uvicorn backend.gateway_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ICBERG_GATEWAY_DB_PATH
        value: /tmp/icberg-demo.db
      - key: ICBERG_GATEWAY_RATE_LIMIT_PER_MIN
        value: "60"
